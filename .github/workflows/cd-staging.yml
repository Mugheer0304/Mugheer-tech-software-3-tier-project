name: CD — Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build & push images
        run: |
          REG="${{ steps.ecr.outputs.registry }}"
          for svc in backend-core frontend worker; do
            docker build -t "$REG/mugheer-$svc:staging" ./$svc
            docker push "$REG/mugheer-$svc:staging"
          done
          declare -A ports=( [anomaly-detection]=ai-anomaly [support-triage]=ai-triage [scoping-assistant]=ai-scoping [code-assist]=ai-codeassist )
          for dir in "${!ports[@]}"; do
            docker build -t "$REG/mugheer-${ports[$dir]}:staging" ./ai-services/$dir
            docker push "$REG/mugheer-${ports[$dir]}:staging"
          done
          # worker image needs the backend Prisma schema to generate its client
          cp backend-core/prisma/schema.prisma worker/prisma/schema.prisma
          docker build -t "$REG/mugheer-worker:staging" ./worker
          docker push "$REG/mugheer-worker:staging"

      - name: Terraform plan (staging)
        working-directory: terraform/environments/staging
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color

      - name: Deploy to staging namespace
        run: |
          aws eks update-kubeconfig --name mugheer-staging
          kubectl apply -k k8s/overlays/staging
          kubectl rollout status deployment/backend-core -n mugheer-staging --timeout=180s

      - name: Smoke tests
        run: ./scripts/smoke-test.sh https://api.staging.mugheer.com
