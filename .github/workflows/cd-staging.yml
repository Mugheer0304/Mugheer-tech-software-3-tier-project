name: CD — Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # Shared build logic — the exact same script Jenkins runs (spec 20.4).
      - name: Build & push images (shared script)
        run: ./scripts/build.sh images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: staging

      - name: Terraform plan (staging)
        working-directory: terraform/environments/staging
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color

      # Shared deploy logic: kubectl apply + rollout gates + smoke tests,
      # identical to the Jenkins 'Deploy Staging' stage.
      - name: Deploy to staging namespace (shared script)
        run: ./scripts/deploy.sh staging
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: staging
