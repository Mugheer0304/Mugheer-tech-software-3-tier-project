name: CD — Production

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # requires manual approval in GitHub settings
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # Shared build logic — same script Jenkins runs for the same commit.
      - name: Build & push images, versioned (shared script)
        run: ./scripts/build.sh images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.ref_name }}

      - name: Terraform apply (production)
        working-directory: terraform/environments/production
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

      # Shared deploy: kubectl apply + pinned images + rollout gates +
      # smoke tests with automatic rollout undo on failure.
      - name: Deploy to production (shared script)
        run: ./scripts/deploy.sh production
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.ref_name }}
