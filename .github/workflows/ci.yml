name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------- unit tier
  backend-unit:
    name: Backend — unit tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-core/package-lock.json
      - run: npm install
        working-directory: backend-core
      - run: npx prisma generate
        working-directory: backend-core
      - name: Typecheck
        run: npx tsc -p tsconfig.build.json --noEmit --incremental false
        working-directory: backend-core
      - name: Build
        run: npm run build
        working-directory: backend-core
      - name: Unit tests (Vitest)
        run: npm run test:unit
        working-directory: backend-core
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: backend-core
          severity: CRITICAL,HIGH

  frontend:
    name: Frontend — typecheck + build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
        working-directory: frontend
      - name: Typecheck + build
        run: npm run build
        working-directory: frontend
      - name: Unit tests (Vitest + Testing Library)
        run: npm test
        working-directory: frontend
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: frontend
          severity: CRITICAL,HIGH

  worker:
    name: Worker — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: worker
      - run: npm test
        working-directory: worker

  # ------------------------------------------------- integration tier (real services)
  backend-integration:
    name: Backend — integration tests (Postgres)
    runs-on: ubuntu-latest
    needs: [backend-unit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mugheer
          POSTGRES_PASSWORD: mugheer
          POSTGRES_DB: mugheer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mugheer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mugheer:mugheer@localhost:5432/mugheer_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret-32-characters-min!!
      JWT_REFRESH_SECRET: test-refresh-secret-32-characters-min
      INTERNAL_SERVICE_TOKEN: dev-internal-token-change-me-please-32ch
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-core/package-lock.json
      - run: npm install
        working-directory: backend-core
      - run: npx prisma generate
        working-directory: backend-core
      - name: Push schema to test database
        run: npx prisma db push --skip-generate
        working-directory: backend-core
      - name: Start API server
        working-directory: backend-core
        run: |
          node dist/main.js &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/v1/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/v1/health > /dev/null
      - name: Integration tests (real Postgres + Redis)
        working-directory: backend-core
        run: npm run test:integration

  # ------------------------------------------------------------------ AI tier
  ai-services:
    name: AI — evaluation tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [anomaly-detection, support-triage, scoping-assistant, code-assist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (system wheels for numpy/scikit-learn)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ai-services/${{ matrix.service }}
      - name: Run evaluation suite (min scores enforced)
        run: pytest tests -q
        working-directory: ai-services/${{ matrix.service }}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: ai-services/${{ matrix.service }}
          severity: CRITICAL,HIGH
