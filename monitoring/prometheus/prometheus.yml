global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: backend-core
    static_configs:
      - targets: ["backend-core:3000"]
  - job_name: ai-anomaly
    metrics_path: /health
    static_configs:
      - targets: ["ai-anomaly:8101"]
  - job_name: ai-triage
    metrics_path: /health
    static_configs:
      - targets: ["ai-triage:8102"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
