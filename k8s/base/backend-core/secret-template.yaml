# =============================================================================
# Secret references — actual values are NEVER committed (spec Section 20.2).
#
# In real deployments these secrets are sourced from AWS Secrets Manager via
# the external-secrets operator; for local clusters create them with kubectl
# (see k8s/README.md). This template documents the required keys name-for-name
# with .env.example (spec Section 7.4 — env vars match across .env.example,
# Kubernetes Secrets/ConfigMaps and Terraform outputs).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  annotations:
    describe: "Populated by external-secrets from AWS Secrets Manager (mugheer/<env>/backend)"
type: Opaque
# stringData intentionally omitted — values come from the external secrets
# store at apply time. Required keys (name-for-name with .env.example):
#
#   DATABASE_URL             postgresql://...   (Terraform module/database output)
#   REDIS_URL                redis://...
#   JWT_ACCESS_SECRET        32+ chars
#   JWT_REFRESH_SECRET       32+ chars
#   INTERNAL_SERVICE_TOKEN   32+ chars (worker/AI → core calls)
#   STRIPE_SECRET_KEY        sk_live_... / sk_test_...
#   STRIPE_WEBHOOK_SECRET    whsec_...
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
#   GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET
#   S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY
#   SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASSWORD
#
# The DATABASE_URL value is produced by terraform/modules/database
# (aws_secretsmanager_secret "mugheer/<env>/db") and consumed here verbatim —
# never re-typed (spec Section 7.4).
