apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mugheer-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.mugheer.com, api.mugheer.com]
      secretName: mugheer-tls
  rules:
    - host: app.mugheer.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
    - host: api.mugheer.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-core
                port: { number: 3000 }
